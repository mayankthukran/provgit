[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provgit"
version = "0.1.0"
description = "Git conflict resolution with testing provenance: know which side of a conflict was tested."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
provgit = "provgit.cli:main"

[tool.setuptools.packages.find]
include = ["provgit*"]
