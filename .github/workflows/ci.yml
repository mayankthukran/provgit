name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity (tests create commits)
        run: |
          git config --global user.name "provgit-ci"
          git config --global user.email "ci@provgit.local"
          git config --global init.defaultBranch main
          git --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests (no LLM needed; model calls are mocked)
        env:
          PROVGIT_LLM: "off"
        run: pytest -v

      - name: Smoke-test the CLI
        run: provgit --version

  # Keeps the check name "test" that branch protection may require; passes only if every
  # Python version passed.
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Python versions passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests failed on at least one Python version: ${{ needs.tests.result }}"; exit 1
          fi
