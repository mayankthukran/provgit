name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity (tests create commits)
        run: |
          git config --global user.name "provgit-ci"
          git config --global user.email "ci@provgit.local"
          git config --global init.defaultBranch main
          git --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests (no LLM needed; model calls are mocked)
        env:
          PROVGIT_LLM: "off"
        run: pytest -v

      - name: Smoke-test the CLI
        run: provgit --version
